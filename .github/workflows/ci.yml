name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphql-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.19.1

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm runtime
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - name: Install locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate repository and documentation contracts
        run: npm run repo:check && npm run docs:check && npm run workflow-pins:check
      - name: Type check
        run: npm run typecheck
      - name: Run governed tests with coverage
        run: npm run test:coverage
      - name: Validate test and coverage evidence
        run: node .github/scripts/validate-test-evidence.mjs reports/junit.xml reports/coverage/coverage-summary.json
      - name: Validate schema contract and fingerprint
        run: npm run schema:check | tee reports/schema-contract.json
      - name: Validate committed operation manifest
        run: npm run manifest:check | tee reports/operation-manifest.json
      - name: Upload GraphQL qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphql-quality-evidence
          path: reports/
          if-no-files-found: error
          retention-days: 14

  node22-compatibility:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Node 22 compatibility contracts
        run: npm run typecheck && npm run test:unit && npm run test:integration

  ci-gate:
    name: ci-gate
    if: always()
    needs: [quality, node22-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate CI jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          NODE22: ${{ needs.node22-compatibility.result }}
        run: |
          set -euo pipefail
          [[ "$QUALITY" == "success" ]] || { echo "quality=$QUALITY"; exit 1; }
          [[ "$NODE22" == "success" ]] || { echo "node22-compatibility=$NODE22"; exit 1; }

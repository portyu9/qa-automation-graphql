name: live-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: 11.19.1

jobs:
  live-graphql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: graphql-live-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute explicit live smoke
        env:
          GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT }}
          GRAPHQL_AUTH_TOKEN: ${{ secrets.GRAPHQL_AUTH_TOKEN }}
          GRAPHQL_AUTH_ALLOWED_HOSTS: ${{ vars.GRAPHQL_AUTH_ALLOWED_HOSTS }}
        run: npm run test:live
      - name: Upload live-smoke JUnit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphql-live-smoke-${{ github.run_id }}
          path: reports/live-junit.xml
          if-no-files-found: error
          retention-days: 7

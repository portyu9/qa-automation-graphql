name: fix-versionless-readme-wording

on:
  push:
    branches: [chore/versionless-docs]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Correct normalized wording
        run: |
          set -euo pipefail
          sed -i 's/Primary primary Node qualification/Primary Node qualification/g' README.md
          node .github/scripts/validate-docs.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-readme-wording-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: correct GraphQL runtime wording"
          git push origin HEAD

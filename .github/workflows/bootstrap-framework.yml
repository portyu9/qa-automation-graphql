name: bootstrap-framework

on:
  push:
    branches: [build/production-graphql-framework]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/production-graphql-framework
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Materialize framework
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/graphql-framework
          cat .bootstrap/part-* | base64 --decode > /tmp/graphql-framework/repo.tar.gz
          tar -xzf /tmp/graphql-framework/repo.tar.gz -C /tmp/graphql-framework
          cp -a /tmp/graphql-framework/. .
      - name: Apply strict optional-property corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Expected bootstrap source fragment missing from {path}')
              target.write_text(text.replace(old, new))

          replace(
              'src/client/graphql-client.ts',
              '  private readonly authToken?: string;',
              '  private readonly authToken: string | undefined;',
          )
          replace(
              'src/schema/execute.ts',
              "import { execute, parse, validate, type ExecutionResult } from 'graphql';",
              "import { GraphQLError, execute, parse, validate, type ExecutionResult } from 'graphql';",
          )
          replace(
              'src/schema/execute.ts',
              "    return { errors: [error instanceof Error ? error : new Error(String(error))] };",
              "    return { errors: [new GraphQLError(error instanceof Error ? error.message : String(error))] };",
          )
          replace(
              'src/server/http-server.ts',
              "import { executeOperation } from '../schema/execute.js';",
              "import { executeOperation, type ExecuteOptions } from '../schema/execute.js';",
          )
          replace(
              'src/server/http-server.ts',
              """      const result = await executeOperation({
        source: body.query,
        variables: variables as Record<string, unknown> | undefined,
        operationName,
        viewerId: viewerFromAuthorization(request.headers.authorization),
        store
      });""",
              """      const executeOptions: ExecuteOptions = { source: body.query, store };
      if (variables !== undefined) executeOptions.variables = variables as Record<string, unknown>;
      if (operationName !== undefined) executeOptions.operationName = operationName;
      const viewerId = viewerFromAuthorization(request.headers.authorization);
      if (viewerId !== undefined) executeOptions.viewerId = viewerId;
      const result = await executeOperation(executeOptions);""",
          )
          replace(
              'tests/smoke/live-endpoint.test.ts',
              "    const client = new GraphQLClient({ endpoint: config.endpoint, authToken: config.authToken, timeoutMs: config.timeoutMs });",
              "    const client = new GraphQLClient(config.authToken\n      ? { endpoint: config.endpoint, authToken: config.authToken, timeoutMs: config.timeoutMs }\n      : { endpoint: config.endpoint, timeoutMs: config.timeoutMs });",
          )
          PY
      - name: Resolve and qualify locked graph
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "npm@11.19.1"
          [[ "$(npm --version)" == "11.19.1" ]]
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run repo:check
          npm run docs:check
          npm run workflow-pins:check
          npm run typecheck
          npm run test
          npm run schema:check
          npm run manifest:check
      - name: Commit qualified framework and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-framework.yml
          rm -f .github/workflows/lock-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'build: qualify production GraphQL framework'
          git push origin HEAD:build/production-graphql-framework

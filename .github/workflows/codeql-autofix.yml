name: codeql-autofix

on:
  pull_request:
    paths:
      - '.github/codeql-autofix.json'
      - '.github/scripts/codeql-autofix-wrapper.selfcheck.mjs'
      - '.github/scripts/codeql-alert-preflight.mjs'
      - '.github/workflows/codeql-autofix.yml'
      - '.github/dependency-governance.json'
  workflow_run:
    workflows: [security]
    types: [completed]
  schedule:
    - cron: '59 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-autofix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  self-test:
    name: codeql-autofix-self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed caller policy without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable canonical Autofix controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portyu9/qa-automation-mobile-appium
          ref: 9280e1cf79bea79c027eabc8abe355ad89e6c010
          path: .codeql-autofix-controller
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate canonical controller against caller policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateAutofixConfig } from './.codeql-autofix-controller/.github/scripts/codeql-autofix-policy.mjs';
          const config = JSON.parse(readFileSync('.github/codeql-autofix.json', 'utf8'));
          if (Object.hasOwn(config, 'targetAlertNumbers')) throw new Error('Caller must discover alert targets from GitHub at runtime');
          // Canonical schema proof with a synthetic, never-requested target.
          const errors = validateAutofixConfig({ ...config, targetAlertNumbers: [config.maxAlertsPerRun] });
          if (errors.length > 0) throw new Error(`Invalid CodeQL autofix config:\n- ${errors.join('\n- ')}`);
          console.log('canonical-controller caller config: valid (runtime alert discovery)');
          NODE
      - name: Exercise caller integration invariants
        run: node --test .github/scripts/codeql-autofix-wrapper.selfcheck.mjs

  propose-fixes:
    name: propose-codeql-autofixes
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'security' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout trusted caller default branch without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable canonical Autofix controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portyu9/qa-automation-mobile-appium
          ref: 9280e1cf79bea79c027eabc8abe355ad89e6c010
          path: .codeql-autofix-controller
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Generate bounded review-only CodeQL autofix proposals
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync, writeFileSync } = await import('node:fs');
            const { join } = await import('node:path');
            const { selectOpenCodeqlTargets } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/codeql-alert-preflight.mjs`
            );
            const { runCodeqlAutofix, validateAutofixConfig } = await import(
              `${process.env.GITHUB_WORKSPACE}/.codeql-autofix-controller/.github/scripts/codeql-autofix-policy.mjs`
            );
            const config = JSON.parse(readFileSync('.github/codeql-autofix.json', 'utf8'));
            if (Object.hasOwn(config, 'targetAlertNumbers')) throw new Error('Tracked policy cannot pin CodeQL alert IDs');
            const errors = validateAutofixConfig({ ...config, targetAlertNumbers: [config.maxAlertsPerRun] });
            if (errors.length) throw new Error(`Invalid CodeQL autofix policy: ${errors.join('; ')}`);
            if (!config.enabled) {
              core.info('CodeQL autofix disabled by reviewed caller policy.');
              return;
            }
            // A successful empty, authenticated inventory is a no-op, not a missing
            // historical alert failure. All HTTP/permission errors remain fatal.
            const response = await github.rest.codeScanning.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              tool_name: config.toolName,
              per_page: 100,
              page: 1,
            });
            const decision = selectOpenCodeqlTargets(response.data, config);
            if (decision.state === 'empty') {
              core.info('CodeQL: zero open alerts confirmed by the authenticated API; no autofix request necessary.');
              return;
            }
            // Runtime-only targets derive exclusively from the authenticated open-alert
            // inventory, bounded by maxAlertsPerRun; no static alert IDs are trusted.
            const configPath = join(process.env.RUNNER_TEMP, 'codeql-open-targets.json');
            writeFileSync(configPath, JSON.stringify({
              ...config, targetAlertNumbers: decision.targets,
            }), { mode: 0o600 });
            core.info(`CodeQL: processing ${decision.targets.length} live alerts; ${decision.queued} queued for later runs.`);
            await runCodeqlAutofix({ github, context, core, configPath });

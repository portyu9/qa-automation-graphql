name: apply-diagram-rescan

on:
  push:
    branches: [docs/diagram-rescan-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/diagram-rescan-fix
      - name: Correct required qualification topology in Mermaid architecture
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('    EVIDENCE --> CIGATE[CI / ci-gate]\n', '    EVIDENCE --> CIGATE[CI / ci-gate]\n    CHANGE --> NODE22[Node 22 compatibility contracts]\n    NODE22 --> CIGATE\n'),
              ('    CLIENT --> LIVE[Explicit live endpoint smoke]\n', '    CLIENT --> LIVE[Manual live endpoint smoke]\n\n    CHANGE --> DOCS[README + repository contracts]\n    DOCS --> DG[Docs / docs-contract]\n'),
              ('    REVIEW[Dependency Review when available] --> SG\n', '    REVIEW[Dependency Review when available] --> SG\n\n    CIGATE --> RESULT[Qualified repository change]\n    DG --> RESULT\n    SG --> RESULT\n'),
              ('    class SDL,OPS,POLICY,SF,MANIFEST contract;\n', '    class SDL,OPS,POLICY,SF,MANIFEST,DOCS contract;\n'),
              ('    class SCHEMA,EXEC,CODE,CLIENT,LOOP,LIVE runtime;\n', '    class SCHEMA,EXEC,CODE,CLIENT,LOOP,LIVE,NODE22 runtime;\n'),
              ('    class TESTS,EVIDENCE evidence;\n', '    class TESTS,EVIDENCE,RESULT evidence;\n'),
              ('    class CIGATE,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n', '    class CIGATE,DG,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one GraphQL diagram fragment: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit README correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: align GraphQL Mermaid diagram with qualification gates'
          git push origin HEAD:docs/diagram-rescan-fix

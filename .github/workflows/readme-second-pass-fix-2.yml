name: readme-second-pass-fix-2

on:
  push:
    branches: [docs/readme-second-pass]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/readme-second-pass
      - name: Refine runtime triage wording
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = 'Runtime compatibility drift distinct from primary Node runtime primary qualification.'
          new = 'Runtime compatibility drift isolated from the repository-designated primary qualification runtime.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact GraphQL triage sentence, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit wording refinement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/readme-second-pass-fix-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/readme-second-pass-fix-2.yml
          git commit -m 'docs: refine GraphQL runtime triage wording'
          git push origin HEAD:docs/readme-second-pass
